name: optimization_env
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python version
  - python=3.14

  # Data Processing & Math
  - numpy
  - pandas
  - scipy
  - sympy

  # Visualization & Plotting
  - matplotlib
  - seaborn
  - plotly

  # Machine Learning & Optimization
  - scikit-learn
  - bayesian-optimization
  - jupyterlab
  - cvxpy

  # Packages only available or preferred via pip
  - pip:
    - matplotplusplus-wrapper  # Example wrapper if managing mixed environments
